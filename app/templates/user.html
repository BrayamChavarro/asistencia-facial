<style>
        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, #adc6ff, transparent);
            animation: scan 2s linear infinite;
            box-shadow: 0 0 12px #adc6ff;
        }
        @keyframes scan {
            0% { top: 10%; }
            50% { top: 90%; }
            100% { top: 10%; }
        }
        .glow-bloom {
            box-shadow: 0 0 24px rgba(173, 198, 255, 0.1);
        }
        .success-bloom {
            box-shadow: 0 0 24px rgba(78, 222, 163, 0.2);
            border-color: #4edea3 !important;
        }
        .error-bloom {
            box-shadow: 0 0 24px rgba(255, 180, 171, 0.2);
            border-color: #ffb4ab !important;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        canvas.overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transform: scaleX(-1);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen w-screen overflow-x-hidden flex flex-col font-body-md">
<!-- Header -->
<header class="w-full flex justify-between items-center px-lg py-md border-b border-surface-container-high bg-surface-container-lowest z-10 shrink-0">
<div class="flex items-center gap-sm cursor-pointer" onclick="location.href='/admin'" title="Panel de Administracion">
<span class="material-symbols-outlined text-primary text-[32px]">security</span>
<span class="font-headline-md text-headline-md font-bold text-primary tracking-tight">SecureGate AI</span>
</div>
<div class="flex items-center gap-sm bg-surface-container-high px-md py-sm rounded-full border border-outline-variant">
<span class="material-symbols-outlined text-on-surface-variant">schedule</span>
<span class="font-body-lg text-body-lg text-on-surface" id="current-time">00:00</span>
</div>
</header>
<!-- Main Kiosk Area -->
<main class="flex-1 flex w-full max-w-[1400px] mx-auto p-4 md:p-6 lg:p-lg gap-4 lg:gap-lg relative min-h-0">
<!-- Left: Camera Viewfinder (Primary Action) -->
<div class="flex-1 flex flex-col items-center justify-center gap-4 lg:gap-lg min-h-0 w-full">
<div class="w-full max-w-[500px] flex-1 min-h-[300px] max-h-[500px] xl:max-h-[600px] bg-surface-container-low rounded-xl border border-outline-variant relative overflow-hidden flex flex-col items-center justify-center glow-bloom transition-all duration-300 shrink" id="camera-container">

<video id="cam" autoplay playsinline></video>
<canvas class="overlay" id="canvasOverlay"></canvas>

<!-- Viewfinder Guides -->
<div class="absolute inset-lg border-2 border-dashed border-outline rounded-lg pointer-events-none opacity-50 z-10"></div>
<!-- Face Contour Target -->
<div class="absolute inset-0 flex items-center justify-center z-20 pointer-events-none">
<div class="w-[180px] h-[240px] md:w-[200px] md:h-[280px] border border-primary rounded-[100px] opacity-70 relative">
<!-- Corner Markers -->
<div class="absolute -top-2 -left-2 w-6 h-6 border-t-2 border-l-2 border-primary"></div>
<div class="absolute -top-2 -right-2 w-6 h-6 border-t-2 border-r-2 border-primary"></div>
<div class="absolute -bottom-2 -left-2 w-6 h-6 border-b-2 border-l-2 border-primary"></div>
<div class="absolute -bottom-2 -right-2 w-6 h-6 border-b-2 border-r-2 border-primary"></div>
</div>
</div>
<!-- Scanning Line -->
<div class="scan-line z-30" id="scan-line"></div>

<!-- Status Overlay (Default Hidden) -->
<div class="absolute inset-0 bg-surface/80 backdrop-blur-sm z-40 flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300" id="success-overlay">
<span class="material-symbols-outlined text-[80px] text-secondary mb-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<h2 class="font-headline-lg text-headline-lg text-secondary" id="overlay-title">Verificado</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-xs" id="overlay-subtitle">Acceso Permitido</p>
<img id="overlay-photo" src="" class="hidden w-24 h-24 rounded-full border-4 border-secondary mt-4 object-cover">
</div>

<div class="absolute bottom-md left-0 w-full text-center z-20" id="camera-hint">
<p class="font-body-md text-body-md text-primary bg-background/80 inline-block px-sm py-xs rounded-full border border-primary/30" id="camera-hint-text">Alinee su rostro con el óvalo</p>
</div>
</div>

<!-- Primary Action Button -->
<button id="btnMark" class="w-full max-w-[500px] bg-primary text-on-primary font-headline-md text-headline-md py-3 md:py-md rounded-lg hover:opacity-90 transition-opacity flex items-center justify-center gap-sm shadow-lg active:scale-95 duration-150 disabled:opacity-50 disabled:cursor-not-allowed shrink-0" onclick="markAttendance()">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">how_to_reg</span>
                <span id="btnMarkText">Marcar Asistencia</span>
            </button>
<p class="font-body-sm text-body-sm text-on-surface-variant text-center max-w-[500px] shrink-0 mb-4 md:mb-0">
                Al marcar asistencia, usted confirma su identidad según las políticas de seguridad de la empresa.
            </p>
</div>

<!-- Right: Real-time Feedback Panel (Recent Check-ins) -->
<aside class="w-[380px] hidden lg:flex flex-col bg-surface-container-low rounded-xl border border-surface-container-high p-lg gap-md shrink-0">
<div class="flex items-center justify-between border-b border-surface-container-high pb-sm">
<h3 class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-xs">
<span class="material-symbols-outlined text-primary">history</span>
                    Actividad Reciente
                </h3>
<span class="bg-secondary/10 text-secondary font-label-md text-label-md px-2 py-1 rounded-full border border-secondary/20 flex items-center gap-1">
<span class="w-2 h-2 rounded-full bg-secondary animate-pulse"></span>
                    En vivo
                </span>
</div>
<div class="flex-1 overflow-y-auto pr-2 space-y-sm" id="recent-list">
<p class="text-on-surface-variant text-sm text-center mt-4">Esperando actividad...</p>
</div>
</aside>
</main>

<script>
        let stream = null;
        let lastUserId = null;

        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('current-time').innerText = hours + ':' + minutes + ' ' + ampm;
        }
        setInterval(updateTime, 1000);
        updateTime();

        async function startCam() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: "user" } });
                document.getElementById('cam').srcObject = stream;
                startFaceDetect();
            } catch(e) {
                document.getElementById('camera-hint-text').innerText = 'Error de cámara: ' + e.message;
                document.getElementById('camera-hint-text').classList.replace('text-primary', 'text-error');
                document.getElementById('camera-hint-text').classList.replace('border-primary/30', 'border-error/30');
            }
        }

        function captureBlob() {
            return new Promise(r => {
                const v = document.getElementById('cam');
                const c = document.createElement('canvas');
                c.width = v.videoWidth; c.height = v.videoHeight;
                c.getContext('2d').drawImage(v, 0, 0);
                c.toBlob(b => r(b), 'image/jpeg', 0.9);
            });
        }

        function playBeep(success) {
            try {
                const ctx = new (window.AudioContext||window.webkitAudioContext)();
                const o = ctx.createOscillator(), g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination); g.gain.value = 0.2;
                if (success) { o.frequency.value = 880; o.start(); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.12); o.stop(ctx.currentTime+0.12); }
                else { o.frequency.value = 440; o.start(); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.25); o.stop(ctx.currentTime+0.25); }
                if (navigator.vibrate) navigator.vibrate(success ? 80 : 150);
            } catch(e) {}
        }

        async function markAttendance() {
            const btn = document.getElementById('btnMark');
            const btnText = document.getElementById('btnMarkText');
            btn.disabled = true; 
            btnText.textContent = 'Procesando...';
            
            const container = document.getElementById('camera-container');
            const scanLine = document.getElementById('scan-line');
            const overlay = document.getElementById('success-overlay');
            const overlayTitle = document.getElementById('overlay-title');
            const overlaySub = document.getElementById('overlay-subtitle');
            const overlayIcon = overlay.querySelector('span.material-symbols-outlined');
            const overlayPhoto = document.getElementById('overlay-photo');

            let blob;
            try {
                blob = await captureBlob();
                if (!blob || blob.size < 1000) throw new Error('Cámara sin imagen');
            } catch(e) {
                overlayIcon.textContent = 'error';
                overlayIcon.classList.replace('text-secondary', 'text-error');
                overlayTitle.textContent = 'Error';
                overlayTitle.classList.replace('text-secondary', 'text-error');
                overlaySub.textContent = e.message;
                overlayPhoto.classList.add('hidden');
                
                container.classList.add('error-bloom');
                overlay.classList.remove('opacity-0');
                
                setTimeout(() => {
                    overlay.classList.add('opacity-0');
                    container.classList.remove('error-bloom');
                    btn.disabled = false;
                    btnText.textContent = 'Marcar Asistencia';
                }, 3000);
                return;
            }

            const fd = new FormData(); fd.append('image', blob, 'c.jpg');
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 15000);
                const res = await fetch('/api/attendance/mark', { method: 'POST', body: fd, signal: controller.signal });
                clearTimeout(timeout);
                const data = await res.json();
                
                scanLine.style.display = 'none';
                
                if (data.success) {
                    lastUserId = data.user_id;
                    const typeLabel = data.type === 'entry' ? 'Entrada' : 'Salida';
                    
                    overlayIcon.textContent = 'check_circle';
                    overlayIcon.classList.remove('text-error');
                    overlayIcon.classList.add('text-secondary');
                    overlayTitle.textContent = data.user_name;
                    overlayTitle.classList.remove('text-error');
                    overlayTitle.classList.add('text-secondary');
                    overlaySub.textContent = typeLabel + ' · ' + (data.confidence*100).toFixed(1) + '% conf.';
                    
                    if (data.photo_url) {
                        overlayPhoto.src = data.photo_url;
                        overlayPhoto.classList.remove('hidden');
                        overlayPhoto.classList.replace('border-error', 'border-secondary');
                    } else {
                        overlayPhoto.classList.add('hidden');
                    }

                    container.classList.add('success-bloom');
                    overlay.classList.remove('opacity-0');
                    playBeep(true);
                    
                    loadMyHistory();
                    
                    setTimeout(() => {
                        overlay.classList.add('opacity-0');
                        container.classList.remove('success-bloom');
                        scanLine.style.display = 'block';
                    }, 3500);

                } else {
                    overlayIcon.textContent = 'cancel';
                    overlayIcon.classList.remove('text-secondary');
                    overlayIcon.classList.add('text-error');
                    overlayTitle.textContent = 'No reconocido';
                    overlayTitle.classList.remove('text-secondary');
                    overlayTitle.classList.add('text-error');
                    overlaySub.textContent = data.detail || data.message;
                    overlayPhoto.classList.add('hidden');

                    container.classList.add('error-bloom');
                    overlay.classList.remove('opacity-0');
                    playBeep(false);
                    
                    setTimeout(() => {
                        overlay.classList.add('opacity-0');
                        container.classList.remove('error-bloom');
                        scanLine.style.display = 'block';
                    }, 3500);
                }
            } catch(e) { 
                overlayIcon.textContent = 'wifi_off';
                overlayIcon.classList.remove('text-secondary');
                overlayIcon.classList.add('text-error');
                overlayTitle.textContent = 'Error';
                overlayTitle.classList.remove('text-secondary');
                overlayTitle.classList.add('text-error');
                overlaySub.textContent = 'No se pudo conectar al servidor';
                overlayPhoto.classList.add('hidden');

                container.classList.add('error-bloom');
                overlay.classList.remove('opacity-0');
                
                setTimeout(() => {
                    overlay.classList.add('opacity-0');
                    container.classList.remove('error-bloom');
                    scanLine.style.display = 'block';
                }, 3500);
            }
            
            setTimeout(() => {
                btn.disabled = false;
                btnText.textContent = 'Marcar Asistencia';
            }, 3500);
        }

        async function loadMyHistory() {
            if (!lastUserId) return;
            try {
                const res = await fetch(`/api/attendance/history?user_id=${lastUserId}&limit=10`);
                const records = await res.json();
                const list = document.getElementById('recent-list');
                
                if (!records.length) { 
                    list.innerHTML = '<p class="text-on-surface-variant text-sm text-center mt-4">Sin registros hoy</p>'; 
                    return; 
                }
                
                list.innerHTML = '';
                records.forEach(r => {
                    const typeLabel = r.type === 'entry' ? 'Entrada' : r.type === 'exit' ? 'Salida' : '-';
                    const timeStr = new Date(r.timestamp).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Bogota' });
                    const isEntry = r.type === 'entry';
                    const colorClass = isEntry ? 'text-secondary' : 'text-error';
                    const iconType = isEntry ? 'login' : 'logout';
                    
                    const initials = r.user_name.substring(0, 2).toUpperCase();
                    
                    const imgHtml = r.photo_url 
                        ? `<img src="${r.photo_url}" class="w-full h-full object-cover">`
                        : `<div class="w-full h-full bg-surface-container-highest flex items-center justify-center text-primary font-bold">${initials}</div>`;

                    const el = document.createElement('div');
                    el.className = 'bg-surface p-sm rounded-lg border border-surface-container-high flex items-center gap-md hover:bg-surface-bright transition-colors cursor-default';
                    el.innerHTML = `
                        <div class="w-12 h-12 rounded-full bg-surface-container-highest border border-outline-variant overflow-hidden shrink-0">
                            ${imgHtml}
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="font-body-md text-body-md font-bold text-on-surface truncate">${r.user_name}</p>
                            <p class="font-body-sm text-body-sm text-on-surface-variant truncate">${typeLabel} · ${(r.confidence*100).toFixed(0)}% conf.</p>
                        </div>
                        <div class="text-right shrink-0">
                            <p class="font-label-md text-label-md text-on-surface-variant">${timeStr}</p>
                            <span class="${colorClass} material-symbols-outlined text-[16px] mt-1" style="font-variation-settings: 'FILL' 1;">${iconType}</span>
                        </div>
                    `;
                    list.appendChild(el);
                });
            } catch(e) {}
        }

        async function detectFaceLoop() {
            const canvas = document.getElementById('canvasOverlay');
            const video = document.getElementById('cam');
            if (!canvas || !video || video.readyState < 2) return;
            try {
                const blob = await captureBlob();
                const fd = new FormData(); fd.append('image', blob, 'f.jpg');
                const res = await fetch('/api/face/detect', { method: 'POST', body: fd });
                if (!res.ok) { drawNoFace(canvas); return; }
                const data = await res.json();
                if (data.success && data.bbox) drawBox(canvas, video, data.bbox);
                else drawNoFace(canvas);
            } catch(e) { drawNoFace(canvas); }
        }

        function drawBox(canvas, video, bbox) {
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const [x1,y1,x2,y2] = bbox;
            const sx = canvas.width / (video.videoWidth||640);
            const sy = canvas.height / (video.videoHeight||480);
            ctx.strokeStyle = '#adc6ff'; ctx.lineWidth = 3;
            ctx.strokeRect(x1*sx, y1*sy, (x2-x1)*sx, (y2-y1)*sy);
            ctx.fillStyle = 'rgba(173, 198, 255, 0.15)';
            ctx.fillRect(x1*sx, y1*sy, (x2-x1)*sx, (y2-y1)*sy);
        }

        function drawNoFace(canvas) {
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function startFaceDetect() { setInterval(detectFaceLoop, 2000); }

        startCam();
    </script>
</body>
</html>
